{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека</title>
    <link rel="stylesheet" href="{% static 'delete.css' %}">
</head>
<body>
    <div class="topbar">
        <a class="logo" href="{% url 'home' %}">Library</a>
        <div class="links">
            <a class="active" href="{% url 'read' %}">Книги</a>
            <a href="{% url 'create' %}">Добавить</a>
        </div>
    </div>

    <div class="content">
        <h1>Удалить книгу?</h1>
        <div class="book-title">{{ book.title }}</div>
        <p>Это действие нельзя отменить</p>

        <form method="POST">
            {% csrf_token %}
            <div class="buttons">
                <button class="btn btn-danger" type="submit">Да, удалить</button>
                <a class="btn-ghost" href="{% url 'read_id' book.id %}">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
