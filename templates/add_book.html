{% load static  %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'add_book.css' %}">
    
</head>
<body>
    <h1>You can add your book here</h1>
    <form method="POST">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Имя книги" required>
    <input type="text" name="genre" placeholder="Жанр" required>
    <input type="text" name="author" placeholder="Название автора" required>
    <input type="number" name="year" placeholder="Год" required>
    <input type="text" name="caption" placeholder="Описание">
    <button type="submit">Submit</button>

    </form>
</body>
</html>
